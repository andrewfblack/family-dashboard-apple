name: FamilyDashboard

options:
  bundleIdPrefix: com.familydashboard
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  minimumXcodeGenVersion: "2.38.0"

packages:
  FamilyDashboardShared:
    path: FamilyDashboardShared

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "29"
    CODE_SIGN_STYLE: Automatic
    # Put your Apple Developer team here, or pick one in Xcode after the
    # project is generated. It is saved in the project either way.
    DEVELOPMENT_TEAM: ""
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  FamilyDashboard:
    type: application
    platform: iOS
    sources:
      - path: FamilyDashboard
    dependencies:
      - package: FamilyDashboardShared
        product: DashboardCore
      - package: FamilyDashboardShared
        product: DashboardUI
    info:
      path: FamilyDashboard/Info.plist
      properties:
        CFBundleDisplayName: Family Dashboard
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Plain HTTP is allowed to the local network, which is what
        # homeassistant.local needs. See the README for a bare IP address.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            100.64.0.0/10:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        NSLocalNetworkUsageDescription: "Family Dashboard connects to your Home Assistant on your local network."
        NSBonjourServices:
          - _home-assistant._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.familydashboard.dashboard
        PRODUCT_NAME: FamilyDashboard
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  FamilyDashboardTV:
    type: application
    platform: tvOS
    sources:
      - path: FamilyDashboardTV
    dependencies:
      - package: FamilyDashboardShared
        product: DashboardCore
      - package: FamilyDashboardShared
        product: DashboardUI
    info:
      path: FamilyDashboardTV/Info.plist
      properties:
        CFBundleDisplayName: Family Dashboard TV
        CFBundleIcons:
          CFBundlePrimaryIcon: AppIcon
        TVTopShelfImage:
          TVTopShelfPrimaryImage: Top Shelf Image
          TVTopShelfPrimaryImageWide: Top Shelf Image Wide
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            100.64.0.0/10:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        NSLocalNetworkUsageDescription: "Family Dashboard connects to your Home Assistant on your local network."
        NSBonjourServices:
          - _home-assistant._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.familydashboard.dashboard.tv
        PRODUCT_NAME: FamilyDashboardTV
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

schemes:
  FamilyDashboard:
    build:
      targets:
        FamilyDashboard: all
    run:
      config: Debug
  FamilyDashboardTV:
    build:
      targets:
        FamilyDashboardTV: all
    run:
      config: Debug
